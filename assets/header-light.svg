<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="José Ramón Sahuquillo, Ruby on Rails Engineer">
  <defs>
    <radialGradient id="glow" cx="88%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0B0D12" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#FAFAF9" stop-opacity="1"/>
      <stop offset="45%" stop-color="#FAFAF9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FAFAF9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
    <style>
      .title { font: 700 56px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -1.5px; fill: #111318; }
      .role { font: 500 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #57606A; }
      .role b { fill: #D30001; font-weight: 600; }
      .mono { font: 400 17px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #57606A; }
      .prompt { fill: #D30001; }
      .chip { font: 500 14px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #57606A; }
      .cursor { fill: #D30001; font-weight: 700; animation: blink 1.1s steps(1) infinite; }
      .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
      .d1 { animation-delay: .05s; } .d2 { animation-delay: .2s; } .d3 { animation-delay: .35s; } .d4 { animation-delay: .5s; }
      .track { stroke: #D30001; stroke-opacity: .55; stroke-width: 2; fill: none; stroke-dasharray: 6 10; animation: run 3s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes run { to { stroke-dashoffset: -64; } }
      @media (prefers-reduced-motion: reduce) {
        .rise, .cursor, .track { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#FAFAF9"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <g transform="translate(760 40)">
      <path class="track" d="M0 300 C 120 220, 200 120, 420 40"/>
      <path class="track" d="M40 300 C 160 220, 240 120, 460 40" style="animation-delay:-1.5s"/>
    </g>
    <rect width="1200" height="340" fill="url(#fade)"/>

    <g transform="translate(72 0)">
      <text class="mono rise d1" x="0" y="82">~/valencia · remote</text>
      <text class="title rise d2" x="-3" y="158">José Ramón Sahuquillo</text>
      <text class="role rise d3" x="0" y="200"><tspan fill="#D30001" font-weight="600">Ruby on Rails</tspan> Engineer at 237 Global</text>

      <g class="rise d4" transform="translate(0 250)">
        <text class="mono" x="0" y="0"><tspan class="prompt">&gt;</tspan> If I don't know how to do it, I don't know how to do it <tspan fill="#111318" font-weight="700">YET</tspan><tspan class="cursor">_</tspan></text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="20" fill="none" stroke="#D0D7DE"/>
</svg>
