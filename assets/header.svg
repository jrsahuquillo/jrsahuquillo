<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Terminal: José Ramón Sahuquillo, Ruby on Rails Engineer at 237 Global">
  <defs>
    <pattern id="scan" width="6" height="3" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#000000" opacity="0.35"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c1"><rect x="48" y="56" width="0" height="42"><animate attributeName="width" from="0" to="346" begin="0.4s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="48" y="112" width="0" height="42"><animate id="a2" attributeName="width" from="0" to="850" begin="1.85s" dur="2.95s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="48" y="168" width="0" height="42"><animate id="a3" attributeName="width" from="0" to="446" begin="5.05s" dur="1.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="48" y="224" width="0" height="42"><animate id="a4" attributeName="width" from="0" to="878" begin="6.85s" dur="3.05s" fill="freeze"/></rect></clipPath>
    <style>
      .mono { font: 24px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .base { fill: #35F06B; }
      .dim  { fill: #1EA64C; }
      .sym  { fill: #93FFB8; }
      .cmd  { fill: #86FF9F; }
      .hi   { fill: #D6FFE0; font-weight: 600; }
    </style>
  </defs>

  <g>
    <rect width="1200" height="340" rx="20" fill="#040A05"/>
    <g filter="url(#glow)">
      <text class="mono base" clip-path="url(#c1)" x="48" y="88"><tspan class="dim">visitor@github</tspan><tspan class="sym">:~$</tspan> <tspan class="cmd">whoami</tspan></text>
      <text class="mono base" clip-path="url(#c2)" x="48" y="144">José Ramón Sahuquillo <tspan class="sym">·</tspan> <tspan class="hi">Ruby on Rails</tspan> Engineer <tspan class="sym">@</tspan> 237 Global</text>
      <text class="mono base" clip-path="url(#c3)" x="48" y="200"><tspan class="dim">visitor@github</tspan><tspan class="sym">:~$</tspan> <tspan class="cmd">cat motto.txt</tspan></text>
      <text class="mono base" clip-path="url(#c4)" x="48" y="256">"If I don't know how to do it, I don't know how to do it <tspan class="hi">YET</tspan>"</text>
    </g>

    <rect width="13" height="32" x="48" y="62" fill="#93FFB8">
      <animate attributeName="x" from="48" to="394" begin="0.4s" dur="1.2s" fill="freeze"/>
      <animate attributeName="x" from="48" to="898" begin="1.85s" dur="2.95s" fill="freeze"/>
      <animate attributeName="x" from="48" to="494" begin="5.05s" dur="1.55s" fill="freeze"/>
      <animate attributeName="x" from="48" to="926" begin="6.85s" dur="3.05s" fill="freeze"/>
      <set attributeName="y" to="62"  begin="0.4s"  fill="freeze"/>
      <set attributeName="y" to="118" begin="1.85s" fill="freeze"/>
      <set attributeName="y" to="174" begin="5.05s" fill="freeze"/>
      <set attributeName="y" to="230" begin="6.85s" fill="freeze"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.06s" repeatCount="indefinite"/>
    </rect>

    <rect width="1200" height="340" rx="20" fill="url(#scan)"/>
    <rect width="1200" height="340" rx="20" fill="url(#vig)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="20" fill="none" stroke="#123D1F"/>
</svg>
